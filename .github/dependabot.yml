# The release toolchain lockfile and the action pins in this repository are
# the only dependencies here. A bump lands as a reviewed PR; the callers pick
# it up when they move their plugin-release.yml pin.
version: 2
updates:
  - package-ecosystem: npm
    directory: /release-tools
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    commit-message:
      prefix: "chore(deps)"
    groups:
      semantic-release:
        patterns:
          - "*"
    ignore:
      # Preset 10 needs conventional-changelog-writer 9, and the latest
      # @semantic-release/release-notes-generator (14.1.1) still loads writer
      # 8, so release notes fail to render. Drop this once a stable notes
      # generator moves to writer 9; CI's release dry run proves the pair.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    commit-message:
      prefix: "chore(deps)"
