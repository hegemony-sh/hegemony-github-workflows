# Shared release workflow for the Hegemony plugin repositories
# (hegemony-*-plugins). A caller runs it on every push to main. semantic-release
# reads the Conventional Commits since the last tag, decides whether anything
# is releasable and, if so, bumps every package, refreshes uv.lock, builds the
# wheels, writes CHANGELOG.md, commits, tags and publishes a GitHub Release
# with the wheels attached. The caller's .releaserc.json holds the repository
# specific part; README.md in this repository states the full contract.

name: Plugin Release

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version handed to actions/setup-python.
        type: string
        required: false
        default: "3.12"
      uv-version:
        description: >-
          uv version handed to astral-sh/setup-uv. Keep it equal to the pin in
          the caller's ci.yml, so the release refreshes the lockfile with the
          resolver CI validated.
        type: string
        required: false
        default: "0.9.28"
      node-version:
        description: Node.js version that runs semantic-release.
        type: string
        required: false
        default: "20"
    secrets:
      RELEASE_TOKEN:
        description: >-
          Token semantic-release pushes the release commit and tag with and
          creates the GitHub Release with. A PAT (or GitHub App token) whose
          owner is a bypass actor of the caller's main ruleset: the built-in
          GITHUB_TOKEN cannot bypass rulesets, even with contents: write.
        required: true

# Nothing by default; each job states what it needs. The caller must grant at
# least the union (contents: write, id-token: write, attestations: write,
# artifact-metadata: write) on its `uses:` job, because a called workflow can
# only narrow what it is given.
permissions: {}

# One release at a time per repository. Two merges in quick succession queue
# rather than race: the second run then sees the first run's release commit
# and tag and either releases on top of it or finds nothing to do.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    # Deliberately NOT on a self-hosted runner: the credential step below
    # writes RELEASE_TOKEN into the workspace's .git/config, which on a
    # non-ephemeral runner outlives the job and is readable by every later job
    # sharing that runner user.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the release commit and tag, create the Release
    outputs:
      released: ${{ steps.outcome.outputs.released }}
      version: ${{ steps.outcome.outputs.version }}
    steps:
      # A caller that maps a secret the repository does not have passes an
      # empty string, which GitHub does not flag. Fail here, with a message
      # that says what to do, rather than deep inside semantic-release.
      - name: Require RELEASE_TOKEN
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is empty. Add it as a repository or organization secret and pass it in the caller's secrets: block."
            exit 1
          fi

      # Full history: semantic-release finds the last release from the tags
      # reachable from main, and a shallow clone has none of them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v7
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: false

      - name: Install dependencies
        run: uv sync --frozen --all-packages

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: ${{ inputs.node-version }}

      # The semantic-release toolchain comes from this repository's
      # release-tools/package-lock.json, at the same commit as this workflow
      # file, so the whole dependency graph is the reviewed one and not
      # whatever the registry resolves on the day. Only that directory is
      # checked out, next to the caller's tree, with nothing persisted: the
      # token is used for the fetch and nowhere else. RELEASE_TOKEN can read
      # this repository because it is an organization-wide token.
      - name: Check out the release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
          path: .hegemony-release-tools
          sparse-checkout: release-tools
          sparse-checkout-cone-mode: true
          persist-credentials: false

      # `npm ci` installs exactly the lockfile or fails; --ignore-scripts keeps
      # package lifecycle scripts from running at all. This step runs before
      # any credential is written to the workspace, so nothing it installs can
      # read one. The conventionalcommits preset is not a plugin but the parser
      # the callers' .releaserc.json names: the default angular preset does not
      # parse the `!` breaking marker, so a bare `feat!:` would release nothing.
      - name: Install semantic-release
        working-directory: .hegemony-release-tools/release-tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Last step before semantic-release runs, and the first that puts the
      # token anywhere on disk: everything installed above is already in place.
      - name: Configure Git credentials
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${REPOSITORY}.git"

      # The caller's .releaserc.json drives everything from here: refusing a
      # version whose Release already exists, the version bump, uv.lock
      # refresh, wheel build, CHANGELOG, release commit, tag and the GitHub
      # Release with dist/*.whl and dist/SHA256SUMS attached. Its exec
      # successCmd records NEW_RELEASE and NEW_RELEASE_VERSION in GITHUB_ENV
      # for the steps below; when nothing is releasable both stay unset.
      - name: Run semantic-release
        run: .hegemony-release-tools/release-tools/node_modules/.bin/semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Record release outcome
        id: outcome
        run: |
          echo "released=${NEW_RELEASE:-false}" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_RELEASE_VERSION:-}" >> "$GITHUB_OUTPUT"

      # The assets cross to the attest job as a run-scoped artifact, so that
      # job, and only that job, holds id-token: write.
      - name: Upload release assets for attestation
        if: env.NEW_RELEASE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            dist/*.whl
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  attest:
    name: Attest Release Assets
    needs: release
    # Artifact attestations need a public repository or an Enterprise plan, so
    # they are unavailable while the repos are private pre-launch — an ungated
    # job fails the whole release run. This gate tests visibility only, so
    # attestation switches back on by itself the moment the repository goes
    # public and there is nothing to revert at launch; an Enterprise plan taken
    # while still private would need the condition relaxed by hand. Both
    # visibility sources are consulted so that one of them being absent for a
    # given trigger cannot leave attestation silently off after launch.
    if: >-
      needs.release.outputs.released == 'true'
      && (github.repository_visibility == 'public'
          || github.event.repository.visibility == 'public')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # mint the OIDC token the attestation is signed with
      attestations: write # store the provenance attestation
      artifact-metadata: write # create the artifact storage record actions/attest v4 writes
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      - name: Attest release asset provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/SHA256SUMS
