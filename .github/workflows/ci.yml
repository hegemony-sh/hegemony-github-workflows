name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every job runs on GitHub-hosted ubuntu-latest: nothing here needs the
# self-hosted host, and once this repository is public a fork's pull request
# must never reach it.
jobs:
  commit-lint:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read # to check out commit history for commitlint
      pull-requests: read # required by wagoid/commitlint-github-action to read PR commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: commitlint.config.mjs

  # The secret scan and the workflow policy scan also run as local pre-commit
  # hooks, which nothing enforces for a contributor who skips them or for a
  # pull request from a fork. Same checks and versions as the hooks in
  # .pre-commit-config.yaml; the plugin repositories' security-scans job does
  # the same.
  security-scans:
    name: Security Scans (gitleaks, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks reads the commits the pull request or push adds.
          fetch-depth: 0
          persist-credentials: false

      # No uv.lock here to key a cache on, so setup-uv's cache would warn on
      # every run and never be invalidated.
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.28"
          enable-cache: false

      # The same version as the pre-commit hook. A release binary checked
      # against the digest the gitleaks project publishes with it, not the
      # gitleaks-action, which needs a licence key for organization repositories.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      # The commits this pull request (or push) adds, like the pre-commit hook
      # checks each commit's changes: a secret already in history is not this
      # change's to answer for.
      - name: Scan the new commits for secrets (gitleaks)
        env:
          RANGE_START: ${{ github.event.pull_request.base.sha || github.event.before }}
          RANGE_END: ${{ github.event.pull_request.head.sha || github.sha }}
        # A push that creates the branch reports an all-zero `before`; with
        # nothing to diff against, the scan reads every commit reachable from
        # the pushed tip, since all of them are new to the branch.
        run: |
          if [ -z "${RANGE_START//0/}" ]; then
            log_opts="$RANGE_END"
          else
            log_opts="$RANGE_START..$RANGE_END"
          fi
          "$RUNNER_TEMP/gitleaks" git --log-opts="$log_opts" --redact --no-banner .

      # Offline, as the pre-commit hook runs without a GitHub token; the online
      # audits would also need one here.
      - name: GitHub Actions policy scan (zizmor)
        run: uvx zizmor@1.22.0 --offline .github/workflows

  reuse:
    name: REUSE Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.28"
          enable-cache: false

      - name: REUSE lint
        run: uvx reuse@6.2.0 lint

  # plugin-release.yml installs release-tools/package-lock.json with exactly
  # this command in every caller's release. Dependabot's lockfile bumps land
  # here first, so a lockfile that no longer installs fails the pull request
  # and not a plugin release. It runs on the Node version plugin-release.yml
  # defaults to, read from that file, so a bump that raises a package's Node
  # minimum past the default fails here: --engine-strict fails the install
  # when a package's `engines` field no longer accepts that Node, and the dry
  # run below proves semantic-release loads and runs on it.
  release-tools:
    name: Release Toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # yq (mikefarah's, v4) is preinstalled on GitHub's Ubuntu runners.
      - name: Read the release workflow's Node.js default
        id: node
        run: |
          version=$(yq '.on.workflow_call.inputs.node-version.default' .github/workflows/plugin-release.yml)
          if [ -z "$version" ] || [ "$version" = null ]; then
            echo "::error file=.github/workflows/plugin-release.yml::no default for the node-version input"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Install the lockfile
        working-directory: release-tools
        run: npm ci --ignore-scripts --engine-strict --no-audit --no-fund

      # Packages that install can still fail together: preset 10 of
      # conventional-changelog-conventionalcommits needs a changelog writer the
      # notes generator does not load, and only a release would have found out.
      # So this dry-runs one in a throwaway repository, with the analyzer and
      # notes settings the callers' .releaserc.json use, and checks the version
      # and the breaking-change notes. env -i keeps the runner's variables out,
      # so semantic-release reads the branch from git and sees no token.
      - name: Dry-run a release
        shell: bash
        run: |
          tools="$GITHUB_WORKSPACE/release-tools"
          repo="$RUNNER_TEMP/dry-run"
          git init -q -b main "$repo"
          git init -q --bare -b main "$repo.git"
          cd "$repo"
          git config user.name ci
          git config user.email ci@example.invalid
          git commit -q --allow-empty -m "feat: first"
          git tag v0.1.0
          git commit -q --allow-empty -m "fix!: drop an old flag"
          git push -q "$repo.git" main v0.1.0
          cat > .releaserc.json <<'JSON'
          {
            "branches": ["main"],
            "plugins": [
              ["@semantic-release/commit-analyzer", {"preset": "conventionalcommits", "releaseRules": [{"breaking": true, "release": "minor"}]}],
              ["@semantic-release/release-notes-generator", {"preset": "conventionalcommits"}]
            ]
          }
          JSON
          env -i PATH="$PATH" HOME="$HOME" "$tools/node_modules/.bin/semantic-release" \
            --dry-run --no-ci --repository-url "file://$repo.git" | tee "$RUNNER_TEMP/dry-run.log"
          grep -q 'The next release version is 0.2.0' "$RUNNER_TEMP/dry-run.log"
          grep -q 'BREAKING CHANGES' "$RUNNER_TEMP/dry-run.log"
